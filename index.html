<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽁지맵</title>
    <meta name="description" content="공시기준가와 최저입찰가를 비교해 경공매 물건 선택을 돕는 지도형 분석 도구" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <script>
      if (location.protocol === "file:") {
        location.replace("http://127.0.0.1:4173/");
      }
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=20260911-region-1" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="물건 필터와 목록">
        <header class="brandbar">
          <div>
            <p class="eyebrow">경공매 물건선택</p>
            <h1>꽁지맵</h1>
          </div>
          <button class="icon-button" id="resetFilters" type="button" title="필터 초기화" aria-label="필터 초기화">
            ↺
          </button>
        </header>

        <section class="metric-strip" aria-label="요약 지표">
          <div>
            <span id="metricCount">0</span>
            <small>화면 물건</small>
          </div>
          <div>
            <span id="metricAvgDiscount">0</span>
            <small>공시가 확인</small>
          </div>
          <div>
            <span id="metricTopScore">0</span>
            <small>입찰 임박</small>
          </div>
        </section>

        <section class="filters" aria-label="필터">
          <label>
            <span>지역</span>
            <select id="regionFilter"></select>
          </label>
          <label>
            <span>최대 위험도</span>
            <select id="riskFilter">
              <option value="all">전체</option>
              <option value="낮음">낮음</option>
              <option value="보통">보통 이하</option>
              <option value="높음">높음 이하</option>
            </select>
          </label>
          <label>
            <span>물건 종별</span>
            <select id="categoryGroupFilter" aria-label="물건 대분류"></select>
          </label>
          <label>
            <span>매각 형태</span>
            <select id="saleFormFilter"></select>
          </label>
          <label class="wide" id="categorySubField" hidden>
            <span>세부 종별</span>
            <select id="categorySubFilter" aria-label="물건 세분류"></select>
          </label>
          <label class="wide">
            <span class="field-head">최소 공시기준 할인율<output id="discountValue">전체</output></span>
            <input id="discountFilter" type="range" min="-100" max="70" step="5" value="-100" />
          </label>
          <div class="range-field wide">
            <span class="field-head">공시가 범위<output id="officialRangeValue">전체</output></span>
            <div class="dual-range" id="officialRange">
              <input id="officialMinFilter" type="range" min="0" max="18" step="1" value="0" aria-label="공시가 하한" />
              <input id="officialMaxFilter" type="range" min="0" max="18" step="1" value="18" aria-label="공시가 상한" />
            </div>
          </div>
        </section>

        <section class="property-list" id="propertyList" aria-label="물건 목록"></section>
      </aside>

      <section class="map-area" aria-label="지도">
        <div class="map-toolbar">
          <div class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="keywordSearch" type="search" placeholder="주소, 사건번호, 메모 검색" />
          </div>
          <div class="data-status" id="dataStatus">데이터 확인 중</div>
        </div>

        <div class="map-stage">
          <div id="naverMap" class="naver-map" hidden></div>
          <div id="fallbackMap" class="fallback-map" aria-label="개발용 좌표 보드">
            <div class="map-grid"></div>
            <div class="map-caption">
              <strong>개발용 지도</strong>
              <span>네이버 지도 키를 적용하면 실제 지도로 전환됩니다.</span>
            </div>
          </div>
        </div>
      </section>

      <aside class="detail-panel" id="detailPanel" aria-label="선택 물건 상세"></aside>
    </main>

    <template id="propertyCardTemplate">
      <article class="property-card">
        <div class="card-main">
          <p class="case-no"></p>
          <span class="score-pill"></span>
        </div>
        <div class="title-line">
          <h2></h2>
          <span class="address"></span>
        </div>
        <div class="num-row">
          <strong class="min-bid"></strong>
          <span class="official-value"></span>
          <span class="official-discount"></span>
        </div>
        <div class="gauge-row">
          <div class="gauge"><i></i></div>
          <span class="gauge-label"></span>
        </div>
        <div class="meta-row">
          <div class="fail-row"></div>
          <div class="tag-row"></div>
        </div>
      </article>
    </template>

    <script type="module">
      import * as categories from "./categories.js?v=20260911-region-1";
      window.GGONGJI_CATEGORIES = categories;
    </script>
    <script src="./app.js?v=20260911-region-1" defer></script>
  </body>
</html>
